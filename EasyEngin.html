<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EasyEngin 1.1</title>
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0;
    background: #0d0d0d;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  #canvas-container {
    width: 100vw;
    height: 100vh;
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
  }
  #panel {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(24, 24, 24, 0.85);
    border: 1px solid #444;
    padding: 10px 12px;
    border-radius: 10px;
    width: calc(100vw - 20px);
    max-width: 260px;
    color: #ddd;
    z-index: 10;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    max-height: calc(100vh - 20px);
    overflow-y: auto;
  }
  #panel h2 { margin: 0 0 6px 0; font-size: 15px; font-weight: 600; }
  #panel label { font-size: 12px; color: #bbb; display: block; margin-top: 6px; }
  #panel input, #panel button, #panel select, #panel textarea {
    width: 100%;
    margin: 2px 0 6px 0;
    padding: 6px;
    background: #222;
    border: 1px solid #555;
    color: #fff;
    border-radius: 6px;
    outline: none;
    font-size: 13px;
  }
  #panel input[type="range"] { padding: 0; margin: 4px 0; }
  #panel button {
    cursor: pointer;
    background: #2a2a2a;
    border: 1px solid #444;
    font-weight: bold;
    padding: 8px;
    transition: background 0.2s, transform 0.1s;
  }
  #panel button:hover { background: #3a3a3a; }
  #panel button:active { transform: scale(0.98); }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }

  /* Estilos do ScriptBox */
  .scriptbox-container {
    margin-top: 10px;
    border-top: 1px solid #333;
    padding-top: 8px;
  }
  .scriptbox-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .scriptbox-header label {
    margin: 0 !important;
    font-weight: 600;
    color: #00ff88 !important;
  }
  #codeEditor {
    font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
    font-size: 11px;
    height: 90px;
    resize: vertical;
    background: #121212;
    border: 1px solid #00ff8844;
    color: #a6e22e;
    line-height: 1.4;
  }
  #codeEditor:focus {
    border-color: #00ff88;
    box-shadow: 0 0 5px rgba(0, 255, 136, 0.3);
  }
  #runScriptBtn {
    background: #005533;
    border-color: #008844;
    color: #00ff88;
  }
  #runScriptBtn:hover { background: #007744; }
</style>

<!-- Importação de Scripts em Ordem Garantida via jsDelivr -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="panel">
  <h2>EasyEngin 1.1</h2>
  <label for="shapeSelect">Objeto</label>
  <select id="shapeSelect">
    <option value="cube">Cubo</option>
    <option value="sphere">Esfera</option>
    <option value="cylinder">Cilindro</option>
    <option value="torus">Toro</option>
    <option value="plane">Plano</option>
  </select>
  
  <label for="colorPicker">Cor</label>
  <input type="color" id="colorPicker" value="#00ff88">
  
  <div class="row">
    <div>
      <label for="scaleX">Escala X/Z</label>
      <input type="range" id="scaleX" min="0.1" max="3" step="0.1" value="1">
    </div>
    <div>
      <label for="scaleY">Escala Y</label>
      <input type="range" id="scaleY" min="0.1" max="3" step="0.1" value="1">
    </div>
  </div>

  <label><input type="checkbox" id="autoRotateCheck" checked style="width: auto; margin-right: 6px;"> Animação</label>

  <button id="addBtn">Adicionar</button>
  <button id="clearBtn">Limpar</button>

  <!-- ScriptBox Customizado -->
  <div class="scriptbox-container">
    <div class="scriptbox-header">
      <label for="codeEditor">ScriptBox (JS)</label>
    </div>
    <textarea id="codeEditor" spellcheck="false" placeholder="// Digite seu código JS aqui..."></textarea>
    <button id="runScriptBtn">▶ Executar Script</button>
  </div>
</div>

<div id="canvas-container"></div>

<script>
  // Variáveis globais acessíveis pelo ScriptBox
  let scene, camera, renderer, controls, objects = [];

  window.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('canvas-container');
    const autoRotateCheck = document.getElementById('autoRotateCheck');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d0d);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 8);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Grade e chão
    const gridHelper = new THREE.GridHelper(12, 12, 0x444444, 0x222222);
    scene.add(gridHelper);

    const shadowPlaneGeom = new THREE.PlaneGeometry(12, 12);
    const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.3 });
    const shadowPlane = new THREE.Mesh(shadowPlaneGeom, shadowPlaneMat);
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.receiveShadow = true;
    scene.add(shadowPlane);

    // Iluminação
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // Script padrão de exemplo no ScriptBox
    const codeEditor = document.getElementById('codeEditor');
    codeEditor.value = `// Exemplo: Criar 5 objetos aleatórios\nfor(let i=0; i<5; i++){\n  let g = new THREE.BoxGeometry(0.5, 0.5, 0.5);\n  let m = new THREE.MeshStandardMaterial({color: Math.random()*0xffffff});\n  let mesh = new THREE.Mesh(g, m);\n  mesh.position.set((Math.random()-0.5)*6, 1 + i*0.6, (Math.random()-0.5)*6);\n  scene.add(mesh);\n  objects.push(mesh);\n}`;

    // Executar código do ScriptBox
    document.getElementById('runScriptBtn').addEventListener('click', () => {
      try {
        const runUserCode = new Function('scene', 'THREE', 'objects', 'camera', 'renderer', codeEditor.value);
        runUserCode(scene, THREE, objects, camera, renderer);
      } catch (err) {
        alert('Erro no Script: ' + err.message);
      }
    });

    document.getElementById('addBtn').addEventListener('click', () => {
      const shape = document.getElementById('shapeSelect').value;
      const color = document.getElementById('colorPicker').value;
      const sx = parseFloat(document.getElementById('scaleX').value);
      const sy = parseFloat(document.getElementById('scaleY').value);
      
      let geom;
      if (shape === 'cube') geom = new THREE.BoxGeometry(1, 1, 1);
      else if (shape === 'sphere') geom = new THREE.SphereGeometry(0.7, 32, 32);
      else if (shape === 'cylinder') geom = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 32);
      else if (shape === 'torus') geom = new THREE.TorusGeometry(0.6, 0.2, 12, 32);
      else geom = new THREE.PlaneGeometry(2, 2);

      const mat = new THREE.MeshStandardMaterial({ 
        color: color, 
        roughness: 0.4, 
        metalness: 0.1,
        side: shape === 'plane' ? THREE.DoubleSide : THREE.FrontSide
      });
      
      const mesh = new THREE.Mesh(geom, mat);
      
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.scale.set(sx, sy, sx);
      mesh.position.set((Math.random() - 0.5) * 4, 1, (Math.random() - 0.5) * 4);
      
      if (shape === 'plane') mesh.rotation.x = -Math.PI / 2;

      scene.add(mesh);
      objects.push(mesh);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      objects.forEach(o => { 
        scene.remove(o); 
        if(o.geometry) o.geometry.dispose(); 
        if(o.material) o.material.dispose(); 
      });
      objects.length = 0;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (autoRotateCheck.checked) {
        objects.forEach(o => o.rotation.y += 0.015);
      }

      renderer.render(scene, camera);
    }
    
    animate();
  });
</script>
</body>
</html>
