<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>EasyEngin 1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
    * { box-sizing: border-box; }
  body { 
    margin: 0; 
    background: #0d0d0d; 
    font-family: 'Segoe UI', sans-serif; 
    overflow: hidden; 
  }
  #panel {
    position: absolute; 
    top: 12px; 
    left: 12px; 
    background: #181818; 
    border: 1px solid #333;
    padding: 14px; 
    border-radius: 6px;
    width: 210px;
    color: #ddd;
  }
  #panel h2 {
    margin: 0 0 10px 0;
    font-size: 16px;
    font-weight: 600;
  }
  #panel input, #panel button {
    width: 100%;
    margin: 6px 0;
    padding: 6px;
    background: #222;
    border: 1px solid #444;
    color: #eee;
    border-radius: 4px;
  }
  #panel button {
    background: #2d6cdf;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  #panel button:hover { background: #2558b8; }
  canvas { display: block; }
</style>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="panel">
  <h2>EasyEngin 1.0</h2>
  <input type="text" id="blockName" placeholder="Nome do bloco" value="Cube">
  <input type="color" id="blockColor" value="#ff3333">
  <button id="addBtn">Adicionar Bloco</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let scene, camera, renderer, controls;
let objects = [];

init();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x202124);

  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 500);
  camera.position.set(6, 4, 6);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444, 1.1));
  
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 100),
    new THREE.MeshStandardMaterial({ color: 0x2a2a2a })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  document.getElementById('addBtn').onclick = addBlock;
  window.onresize = onResize;
  
  loop();
}

function addBlock() {
  const name = document.getElementById('blockName').value || 'Cube';
  const color = document.getElementById('blockColor').value;

  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color })
  );
  mesh.name = name;
  mesh.position.set((Math.random()-0.5)*4, 1.5, (Math.random()-0.5)*4);
  
  scene.add(mesh);
  objects.push(mesh);
}

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
