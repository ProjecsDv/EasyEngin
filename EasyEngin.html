<!DOCTYPE html>
<html>
<head>
<title>EASYENGIN 1.1</title>
<style>
body{background:#111;color:white;font-family:Arial;text-align:center}
#blocos{margin:20px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bloco{width:50px;height:50px;border:2px solid white;cursor:pointer}
button{padding:10px;margin:5px;background:#0a0;color:white;border:none;cursor:pointer}
</style>
</head>
<body>

<h1>EASYENGIN 1.1</h1>

<input type="color" id="cor" value="#ff0000">
<button onclick="addBloco()">Criar Bloco</button>
<button onclick="salvarJogo()">Salvar Jogo</button>
<button onclick="carregarJogo()">Carregar Jogo</button>
<button onclick="limparTudo()">Limpar Tudo</button>

<div id="blocos"></div>

<script>
let blocos = [];

function addBloco(){
  let cor = document.getElementById('cor').value;
  blocos.push(cor);
  desenharBlocos();
}

function desenharBlocos(){
  let div = document.getElementById('blocos');
  div.innerHTML = '';
  for(let i=0; i<blocos.length; i++){
    let b = document.createElement('div');
    b.className = 'bloco';
    b.style.background = blocos[i];
    b.onclick = function(){ deletarBloco(i) };
    div.appendChild(b);
  }
}

function deletarBloco(i){
  blocos.splice(i,1);
  desenharBlocos();
}

function salvarJogo(){
  localStorage.setItem('easyengin_save', JSON.stringify(blocos));
  alert('Jogo Salvo!');
}

function carregarJogo(){
  let save = localStorage.getItem('easyengin_save');
  if(save){
    blocos = JSON.parse(save);
    desenharBlocos();
    alert('Jogo Carregado!');
  }else{
    alert('Nenhum save encontrado');
  }
}

function limparTudo(){
  blocos = [];
  desenharBlocos();
}

carregarJogo();
</script>

</body>
</html>
