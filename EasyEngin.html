<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EasyEngin 1.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0;
    background: #0d0d0d;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  #canvas-container {
    width: 100vw;
    height: 100vh;
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
  }
  #panel {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(24, 24, 24, 0.85);
    border: 1px solid #444;
    padding: 16px;
    border-radius: 12px;
    width: calc(100vw - 20px);
    max-width: 300px;
    color: #ddd;
    z-index: 10;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #panel h2 {
    margin: 0 0 10px 0;
    font-size: 18px;
    font-weight: 600;
  }
  #panel label {
    font-size: 13px;
    color: #bbb;
    display: block;
    margin-top: 8px;
  }
  #panel input, #panel button, #panel select {
    width: 100%;
    margin: 4px 0 10px 0;
    padding: 10px;
    background: #222;
    border: 1px solid #555;
    color: #fff;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
  }
  #panel input[type="range"] {
    padding: 0;
    margin: 8px 0;
  }
  #panel button {
    cursor: pointer;
    background: #2a2a2a;
    border: 1px solid #444;
    font-weight: bold;
    transition: background 0.2s, transform 0.1s;
  }
  #panel button:hover { background: #3a3a3a; }
  #panel button:active { transform: scale(0.98); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="panel">
  <h2>EasyEngin 1.1</h2>
  <label for="shapeSelect">Objeto</label>
  <select id="shapeSelect">
    <option value="cube">Cubo</option>
    <option value="sphere">Esfera</option>
    <option value="cylinder">Cilindro</option>
    <option value="torus">Toro</option>
    <option value="plane">Plano</option>
  </select>
  
  <label for="colorPicker">Cor</label>
  <input type="color" id="colorPicker" value="#00ff88">
  
  <div class="row">
    <div>
      <label for="scaleX">Escala X/Z</label>
      <input type="range" id="scaleX" min="0.1" max="3" step="0.1" value="1">
    </div>
    <div>
      <label for="scaleY">Escala Y</label>
      <input type="range" id="scaleY" min="0.1" max="3" step="0.1" value="1">
    </div>
  </div>

  <label><input type="checkbox" id="autoRotateCheck" checked style="width: auto; margin-right: 8px;"> Animação</label>

  <button id="addBtn">Adicionar</button>
  <button id="clearBtn">Limpar</button>
</div>

<div id="canvas-container"></div>

<script>
  const container = document.getElementById('canvas-container');
  const autoRotateCheck = document.getElementById('autoRotateCheck'); // Referência guardada fora da animação

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0d0d);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(5, 5, 8);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Otimização para telas de alta densidade
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Sombras mais suaves
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
  scene.add(gridHelper);

  // Chão invisível só para pegar a sombra
  const shadowPlaneGeom = new THREE.PlaneGeometry(20, 20);
  const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.3 });
  const shadowPlane = new THREE.Mesh(shadowPlaneGeom, shadowPlaneMat);
  shadowPlane.rotation.x = -Math.PI / 2;
  shadowPlane.receiveShadow = true;
  scene.add(shadowPlane);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 5);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  scene.add(dirLight);

  const objects = [];

  document.getElementById('addBtn').addEventListener('click', () => {
    const shape = document.getElementById('shapeSelect').value;
    const color = document.getElementById('colorPicker').value;
    const sx = parseFloat(document.getElementById('scaleX').value);
    const sy = parseFloat(document.getElementById('scaleY').value);
    
    let geom;
    if (shape === 'cube') geom = new THREE.BoxGeometry(1, 1, 1);
    else if (shape === 'sphere') geom = new THREE.SphereGeometry(0.7, 32, 32);
    else if (shape === 'cylinder') geom = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 32);
    else if (shape === 'torus') geom = new THREE.TorusGeometry(0.6, 0.2, 16, 100);
    else geom = new THREE.PlaneGeometry(2, 2);

    const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.1 });
    const mesh = new THREE.Mesh(geom, mat);
    
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.scale.set(sx, sy, sx);
    mesh.position.set((Math.random() - 0.5) * 4, 1, (Math.random() - 0.5) * 4);
    
    if (shape === 'plane') mesh.rotation.x = -Math.PI / 2;

    scene.add(mesh);
    objects.push(mesh);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    objects.forEach(o => { 
      scene.remove(o); 
      o.geometry.dispose(); 
      o.material.dispose(); 
    });
    objects.length = 0;
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();

    if (autoRotateCheck.checked) {
      objects.forEach(o => o.rotation.y += 0.015);
    }

    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
